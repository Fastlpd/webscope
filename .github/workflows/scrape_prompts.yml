name: Prompt scrape and analysis (open PR)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Run prompt scraper
        env:
          PROMPT_SOURCES: ${{ secrets.PROMPT_SOURCES }}
          PROMPT_DOMAINS_BLOCK: ${{ secrets.PROMPT_DOMAINS_BLOCK }}
          PROMPT_DOMAINS_ALLOW: ${{ secrets.PROMPT_DOMAINS_ALLOW }}
          MAX_PROMPTS_PER_SOURCE: ${{ secrets.MAX_PROMPTS_PER_SOURCE || '20' }}
          MIN_PROMPT_WORDS: ${{ secrets.MIN_PROMPT_WORDS || '8' }}
        run: python scripts/scrape_and_analyze.py

      - name: Create pull request if prompt bank changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update prompt bank from scraper"
          branch: "automated/prompt-bank-update-${{ github.run_id }}"
          title: "Automated prompt bank update"
          body: |
            Review newly collected prompt templates and their source URLs before merging.
            This workflow does not generate or publish YouTube videos.
          add-paths: prompts/prompt_bank.csv
          
